<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    const canvas=document.querySelector("#unity-canvas");
    function getCookie(name) {
      let value = "; " + document.cookie;
      let parts = value.split("; " + name + "=");
      if (parts.length === 2) return parts.pop().split(";").shift();
      return null;
    }

    // const token = getCookie('token');
    // console.log("token:",token);
function resizeCanvas() {
  const aspectRatio = 9 / 16; // Portrait aspect ratio
  const windowWidth = window.innerWidth;
  const windowHeight = window.innerHeight;

  let canvasWidth, canvasHeight;

  // Ensure the canvas stays in portrait mode
  if (windowWidth / windowHeight > aspectRatio) {
    // Window is too wide; constrain by height
    canvasHeight = windowHeight;
    canvasWidth = canvasHeight * aspectRatio;
  } else {
    // Window is too tall or matches aspect ratio; constrain by width
    canvasWidth = windowWidth;
    canvasHeight = canvasWidth / aspectRatio;
  }

  // Apply calculated size
  canvas.style.width = `${canvasWidth}px`;
  canvas.style.height = `${canvasHeight}px`;
}


    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 100);
    });

    var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: 1
      };

        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
          }).then((unityInstance) => {

            canvas.requestFullscreen(1);
            if(unityInstance){
            }
            
          }).catch((message) => {
            alert(message);
          });
        };
        
        document.body.appendChild(script);
        window.addEventListener('load', resizeCanvas());
  </script>
</body>

</html>
